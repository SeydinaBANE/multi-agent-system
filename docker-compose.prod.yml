services:
  api:
    volumes: []
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 2
    restart: unless-stopped
    ports:
      - "0.0.0.0:8000:8000"

  frontend:
    restart: unless-stopped
    build:
      context: ./frontend-next
      dockerfile: Dockerfile
      args:
        # En prod, remplacer par l'IP publique du VPS
        NEXT_PUBLIC_API_URL: http://${VPS_IP:-localhost}:8000
    ports:
      - "0.0.0.0:3000:3000"

  postgres:
    restart: unless-stopped
    # Ne pas exposer PostgreSQL publiquement
    ports: []

  redis:
    restart: unless-stopped
    # Ne pas exposer Redis publiquement
    ports: []

  qdrant:
    restart: unless-stopped
    # Ne pas exposer Qdrant publiquement
    ports: []
